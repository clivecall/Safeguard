<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safeguard Door Sleeve</title>
  <meta name="description" content="A phone sleeve that hangs outside the door, for families who keep a no-phones rule.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">
  <main>
    <div class="wrap store-head">
      <h1 class="duo"><b data-copy="store.title"></b> <span data-copy="hero.headline"></span></h1>
    </div>

    <nav class="cats" aria-label="Shop by category">
      <a href="product.html"><img src="img/pack.png" alt="" width="390" height="428"><span data-copy="store.cat4pack"></span></a>
      <a href="product.html"><img src="img/sleeve-back.png" alt="" width="307" height="428"><span data-copy="store.catBack"></span></a>
      <a href="#routine"><img src="img/routine.png" alt="" width="261" height="428"><span data-copy="store.catRoutine"></span></a>
      <a href="#faq"><img src="img/faq.png" alt="" width="273" height="428"><span data-copy="store.catFaq"></span></a>
    </nav>

    <section class="shelf-block" id="shop">
      <h2 class="wrap duo"><b data-copy="store.shopTitle"></b> <span data-copy="store.shopSub"></span></h2>
      <div class="shelf">
        <a class="promo featured" href="product.html">
          <div>
            <p class="eyebrow" data-copy="hero.badge"></p>
            <h3 data-copy="store.card1title"></h3>
            <p><span data-copy="buy.why"></span><br><b data-product="safeguard-4pack" data-field="packPriceCents"></b> · <span data-copy="buy.shipping"></span></p>
          </div>
          <img src="img/pack.png" alt="Four cream canvas sleeves side by side, each showing only the top of a phone" width="390" height="428">
        </a>
        <a class="promo" href="product.html">
          <div>
            <p class="eyebrow" data-copy="features.f1sub"></p>
            <h3 data-copy="store.card3title"></h3>
            <p data-copy="product.detail1"></p>
          </div>
          <img src="img/sleeve-back.png" alt="The sleeve beside its back, which has six suction cups in three rows of two" width="307" height="428">
        </a>
        <a class="promo" href="#faq">
          <div>
            <p class="eyebrow" data-copy="store.catDoors"></p>
            <h3 data-copy="doors.bestOn"></h3>
            <p data-copy="store.card4sub"></p>
          </div>
          <img src="img/door.png" alt="A cream sleeve on a door, with only the top of a phone showing" width="268" height="428">
        </a>
      </div>
      <p class="wrap footnote" data-copy="preorder.notice"></p>
    </section>

    <section class="shelf-block" id="rooms">
      <h2 class="wrap duo"><b data-copy="rooms.title"></b> <span data-copy="store.roomsSub"></span></h2>
      <div class="shelf">
        <a class="promo wide bedroom" href="product.html">
          <div>
            <p class="eyebrow" data-copy="rooms.bedroomTitle"></p>
            <h3 data-copy="rooms.bedroom"></h3>
            <p class="more" data-copy="rooms.cta"></p>
          </div>
          <img src="img/routine.png" alt="" width="261" height="428">
        </a>
        <a class="promo wide bathroom" href="product.html">
          <div>
            <p class="eyebrow" data-copy="rooms.bathroomTitle"></p>
            <h3 data-copy="rooms.bathroom"></h3>
            <p class="more" data-copy="rooms.cta"></p>
          </div>
          <img src="img/sleeve.png" alt="" width="340" height="428">
        </a>
      </div>
    </section>

    <section class="shelf-block" id="routine">
      <h2 class="wrap duo"><b data-copy="store.routineTitle"></b> <span data-copy="routine.sub"></span></h2>
      <ol class="shelf steps">
        <li class="tip"><h3 data-copy="routine.step1title"></h3><p data-copy="routine.step1"></p></li>
        <li class="tip"><h3 data-copy="routine.step2title"></h3><p data-copy="routine.step2"></p></li>
        <li class="tip"><h3 data-copy="routine.step3title"></h3><p data-copy="routine.step3"></p></li>
        <li class="tip"><h3 data-copy="routine.step4title"></h3><p data-copy="routine.step4"></p></li>
        <li class="tip"><h3 data-copy="routine.step5title"></h3><p data-copy="routine.step5"></p></li>
      </ol>
    </section>

    <section class="shelf-block" id="difference">
      <h2 class="wrap duo"><b data-copy="store.diffTitle"></b> <span data-copy="store.diffSub"></span></h2>
      <div class="shelf">
        <div class="tip">
          <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="11" r="4"/><circle cx="23" cy="11" r="4"/><circle cx="9" cy="23" r="4"/><circle cx="23" cy="23" r="4"/></g></svg>
          <p><b data-copy="features.f1"></b> <span data-copy="features.f1sub"></span></p>
        </div>
        <div class="tip">
          <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4c5 7 8 11 8 15a8 8 0 0 1-16 0c0-4 3-8 8-15z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <p><b data-copy="features.f2"></b> <span data-copy="features.f2sub"></span></p>
        </div>
        <div class="tip">
          <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="10" y="3" width="12" height="14" rx="2"/><rect x="7" y="12" width="18" height="17" rx="3"/></g></svg>
          <p><b data-copy="features.f3"></b> <span data-copy="features.f3sub"></span></p>
        </div>
        <div class="tip">
          <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16h22M21 10l6 6-6 6M11 10l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <p><b data-copy="features.f4"></b> <span data-copy="features.f4sub"></span></p>
        </div>
      </div>
    </section>

    <section class="wrap block" id="faq">
      <h2 class="duo"><b data-copy="faq.title"></b> <span data-copy="store.faqSub"></span></h2>
      <div class="faq">
        <details><summary data-copy="faq.q1"></summary><p data-copy="faq.a1"></p></details>
        <details><summary data-copy="faq.q2"></summary><p data-copy="faq.a2"></p></details>
        <details><summary data-copy="faq.q7"></summary><p data-copy="doors.note"></p></details>
        <details><summary data-copy="faq.q3"></summary><p data-copy="faq.a3"></p></details>
        <details><summary data-copy="faq.q4"></summary><p data-copy="faq.a4"></p></details>
        <details><summary data-copy="faq.q5"></summary><p data-copy="faq.a5"></p></details>
        <details><summary data-copy="faq.q6"></summary><p data-copy="faq.a6"></p></details>
      </div>
    </section>
  </main>

  <script type="module">
    import './js/chrome.js';
    import { boot } from './js/data.js';
    import { captureSource } from './js/source.js';
    captureSource();
    await boot();
  </script>
</body>
</html>
